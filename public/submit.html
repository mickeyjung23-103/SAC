<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>전략 제출 | 폭SAC 속았수다</title>
  <style>
    :root {
      --primary-color: #3949ab;
      --primary-hover: #303f9f;
      --dark-blue: #1a237e;
      --danger-color: #c62828;
      --danger-hover: #b71c1c;
      --success-color: #2e7d32;
      --success-bg: #e8f5e9;
      --error-color: #c62828;
      --error-bg: #ffebee;
      --progress-color: #0d47a1;
      --progress-bg: #e3f2fd;
      --bg-color: #f0f2f5;
      --card-bg: #ffffff;
      --text-color: #333;
      --text-light: #555;
      --border-color: #ddd;
      --editor-bg: #f9f9f9;
      --editor-border: #e0e0e0;
      --border-radius: 8px;
      --shadow: 0 4px 12px rgba(0,0,0,.05);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      line-height: 1.6;
    }
    
    * { box-sizing: border-box; }

    .topbar {
      background: var(--card-bg);
      padding: 12px 24px;
      box-shadow: 0 2px 4px rgba(0,0,0,.05);
      margin-bottom: 24px;
    }

    .topbar-container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .brand {
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--dark-blue);
    }
    
    .userbox {
      font-size: 14px;
      color: var(--text-light);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    
    .userbox .rank {
      font-weight: 700;
      color: var(--dark-blue);
    }
    
    .logout-btn {
      padding: 6px 12px;
      border: 1px solid var(--danger-color);
      border-radius: 6px;
      background: transparent;
      color: var(--danger-color);
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    
    .logout-btn:hover {
      background: var(--danger-color);
      color: #fff;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 24px;
      padding: 0 20px;
    }
    
    .card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      padding: 28px;
    }

    h1 {
      text-align: center;
      color: var(--dark-blue);
      margin: 0 0 24px;
      font-size: 2.25rem;
      font-weight: 800;
    }
    
    h2 {
      margin: 0 0 16px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      font-size: 1.5rem;
      color: var(--dark-blue);
    }

    .sidebar h2 {
      font-size: 1.25rem;
      margin-top: 24px;
    }
    .sidebar h2:first-child {
      margin-top: 0;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-light);
      margin-bottom: 6px;
    }

    .meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
    
    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(57, 73, 171, 0.15);
    }

    textarea {
      height: 380px;
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      background: var(--editor-bg);
      color: var(--text-color);
      line-height: 1.5;
      border-color: var(--editor-border);
    }
    
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--primary-color);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      box-shadow: 0 4px 10px rgba(57, 73, 171, 0.2);
    }
    
    .status {
      margin-top: 16px;
      padding: 14px;
      border-radius: 6px;
      display: none;
      white-space: pre-wrap;
      font-size: 0.9rem;
      line-height: 1.5;
      border: 1px solid transparent;
    }
    
    .ok { display: block; background: var(--success-bg); color: var(--success-color); border-color: #b9e0ba; }
    .err { display: block; background: var(--error-bg); color: var(--error-color); border-color: #f7c5c8; }
    .progress { display: block; background: var(--progress-bg); color: var(--progress-color); border-color: #b3d9f8; }
    
    .nav {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .nav a {
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 500;
    }
    .nav a:hover {
      text-decoration: underline;
    }

    .sidebar ul {
      margin: 0;
      padding: 0;
      list-style-position: inside;
      color: var(--text-light);
      font-size: 0.9rem;
    }
    .sidebar ul li {
      margin-bottom: 8px;
    }
    
    .note {
      font-size: 13px;
      color: var(--text-light);
      margin-top: 12px;
      text-align: center;
    }
    
    .readonly {
      background: #f9f9f9;
      color: var(--text-light);
    }

    @media (max-width: 900px) {
      .wrap {
        grid-template-columns: 1fr; /* 모바일에서 1단으로 */
      }
      .sidebar {
        order: -1; /* 사이드바를 위로 */
      }
      h1 {
        font-size: 1.75rem;
      }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-container">
      <div class="brand">폭SAC 속았수다</div>
      <div class="userbox">
        <span id="myRank" class="rank">순위: 계산중...</span>
        <button id="logoutBtn" class="logout-btn">로그아웃</button>
      </div>
    </div>
  </div>

  <div class="wrap">
    <main class="card">
      <h1>전략 제출</h1>
      <h2>Python 전략 코드</h2>
      <div class="meta">
        <div>
          <label for="nickname">닉네임</label>
          <input id="nickname" class="readonly" type="text" readonly />
        </div>
        <div>
          <label for="password">비밀번호</label>
          <input id="password" class="readonly" type="password" readonly />
        </div>
      </div>

      <textarea id="code-editor" spellcheck="false">def strategy(opponent_history, my_history):
    """
    opponent_history: 상대의 이전 행동 리스트 (예: ['협력','배신'])
    my_history: 나의 이전 행동 리스트
    반환값: '협력' 또는 '배신'
    """
    # 예: 팃포탯 (Tit for Tat)
    if not opponent_history:
        return '협력'
    return '협력' if opponent_history[-1] == '협력' else '배신'
</textarea>

      <button id="submitBtn" class="btn btn-primary" style="margin-top: 16px;">코드 제출</button>
      <div id="status" class="status"></div>
      <div class="note">※ 제출 후 5분 이내에 다음 토너먼트가 실행됩니다.</div>
    </main>

    <aside class="card sidebar">
      <h2>바로 가기</h2>
      <div class="nav">
        <a href="about.html">소개 및 규칙</a>
        <a href="scoreboard.html">스코어보드 보기</a>
      </div>
      
      <h2 style="margin-top:20px">Tip</h2>
      <ul style="margin:0 0 0 18px; padding:0;">
        <li>무한루프/느린 계산은 시간초과로 실격 처리됩니다.</li>
        <li>허용 모듈: math, random, statistics, itertools, functools, collections, heapq, bisect</li>
      </ul>
    </aside>
  </div>

  <script>
    /* ✅ (수정) Render 배포이므로 ""로 비워둡니다. */
    const API_BASE_URL = ""; 
    const statusBox = document.getElementById('status');
    const nickEl   = document.getElementById('nickname');
    const passEl   = document.getElementById('password');
    const codeEl   = document.getElementById('code-editor');
    const rankEl   = document.getElementById('myRank');
    const submitBtn = document.getElementById('submitBtn');

    function showStatus(message, kind) {
      statusBox.textContent = message;
      statusBox.className = 'status';
      if (kind) statusBox.classList.add(kind);
      statusBox.style.display = 'block';
    }
    
    function setLoading(isLoading) {
      if(isLoading) {
        submitBtn.disabled = true;
        /* ✅ (수정) '토너먼트 진행 중' -> '제출 중' */
        submitBtn.textContent = '제출 중...';
        showStatus('🏁 코드를 검증하고 제출하는 중입니다...', 'progress');
      } else {
        submitBtn.disabled = false;
        submitBtn.textContent = '코드 제출';
      }
    }

    function logout(){
      localStorage.removeItem('pd_nick');
      localStorage.removeItem('pd_pass');
      location.href = 'login.html';
    }
    document.getElementById('logoutBtn').addEventListener('click', logout);

    async function fetchMyRank(nick){
      try{
        const res = await fetch(`${API_BASE_URL}/scoreboard?t=${Date.now()}`, {cache:'no-store'});
        if(!res.ok) throw new Error(res.statusText);
        const list = await res.json();
        let rank = list.findIndex(x => x.user_name === nick);
        if(rank === -1) rankEl.textContent = `순위: -`;
        else rankEl.textContent = `순위: ${rank+1} / ${list.length}`;
      }catch(e){
        rankEl.textContent = '순위: -';
      }
    }

    async function loadMyCode(user_name, password){
      try{
        const res = await fetch(`${API_BASE_URL}/mycode`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({user_name, password})
        });
        const text = await res.text();
        let data={}; try{ data = text? JSON.parse(text):{} }catch{ data={detail:text}; }
        if (!res.ok) throw new Error(data.detail || '코드 불러오기 실패');
        codeEl.value = data.code || codeEl.value;
      }catch(e){
        console.warn(e.message);
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      const nick = localStorage.getItem('pd_nick');
      const pass = localStorage.getItem('pd_pass');
      if (!nick || !pass) { alert('로그인이 필요합니다.'); location.href='login.html'; return; }
      nickEl.value = nick; passEl.value = pass;
      
      // 병렬로 실행
      Promise.all([
        loadMyCode(nick, pass),
        fetchMyRank(nick)
      ]);
    });

    submitBtn.addEventListener('click', async () => {
      const user_name = nickEl.value;
      const password  = passEl.value;
      const code      = codeEl.value;

      setLoading(true);

      try {
        const res = await fetch(`${API_BASE_URL}/submit`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Cache-Control': 'no-store' },
          body: JSON.stringify({ user_name, password, code })
        });

        const text = await res.text();
        let data={}; try{ data = text? JSON.parse(text):{} }catch{ data={detail:text}; }

        if (!res.ok) {
          showStatus(`❌ 제출 실패\n${data.detail || '알 수 없는 오류'}`, 'err');
        } else {
          /* ✅ (수정) 성공 메시지 변경 */
          showStatus('✅ 성공적으로 제출되었습니다!\n다음 토너먼트에 반영됩니다.', 'ok');
          /* ❌ (삭제) fetchMyRank(user_name); - 제출 직후 순위 갱신 불필요 */
        }
      } catch (e) {
        showStatus(`네트워크 오류: ${e.message}`, 'err');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
